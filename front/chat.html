<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破妄 · AI 洞察问答</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<style>
  .chat-layout { display:grid; grid-template-columns:300px 1fr; gap:16px; height:calc(100vh - 60px - 40px); }
  @media(max-width:860px){ .chat-layout{grid-template-columns:1fr; height:auto} }
  .side { border:2px solid var(--line); background:var(--surface); padding:18px; overflow-y:auto;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%); }
  .side h3 { font-size:12px; font-weight:900; letter-spacing:3px; text-transform:uppercase; margin:16px 0 10px; display:flex; align-items:center; gap:8px; }
  .side h3::before { content:""; width:10px; height:10px; background:var(--cyan); transform:rotate(45deg); }
  .snap-line { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px solid var(--grid); }
  .chat-main { border:2px solid var(--line); background:var(--surface); display:flex; flex-direction:column; min-height:420px; }
  .chat-log { flex:1; overflow-y:auto; padding:20px; background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:32px 32px; }
  .msg { margin-bottom:16px; max-width:82%; }
  .msg.user { margin-left:auto; }
  .msg .who { font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .msg .bubble { padding:11px 15px; border:2px solid var(--line); white-space:pre-wrap; font-size:13.5px; background:var(--paper); }
  .msg.user .bubble { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:5px 5px 0 rgba(39,67,255,.25); }
  .msg.ai .bubble { box-shadow:6px 6px 0 rgba(0,217,233,.22); }
  .chat-input { display:flex; gap:10px; padding:14px; border-top:3px solid var(--line); }
  .chat-input input { flex:1; }
  .typing::after { content:"▮"; animation:blink 1s steps(1) infinite; color:var(--cyan); }
  @keyframes blink { 50%{opacity:0} }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="logo"><span class="ring"></span><span class="core"></span><span class="cut"></span></span>
    <span><span class="brand-name">破妄</span></span>
  </a>
  <nav class="nav">
    <a href="/">首页</a>
    <a href="/dashboard">看板</a>
    <a href="/comments">评论</a>
    <a href="/chat" class="active">问答</a>
    <a href="/label">标注</a>
    <button class="theme-toggle" data-theme-toggle><span class="ico"></span><span class="txt">夜间</span></button>
  </nav>
</header>

<div class="wrap" style="padding-top:20px">
  <div class="kicker">LangChain Agent · Insight QA</div>
  <div class="chat-layout">
    <aside class="side">
      <h3>数据快照</h3>
      <div id="snap"><span class="muted">加载中...</span></div>
      <h3>试试这样问</h3>
      <div id="hintList" class="muted small" style="line-height:2.05">
        <div class="hint-q" style="cursor:pointer;padding:3px 0;border-bottom:1px solid var(--grid)">· 这个视频的赞美占比是多少？</div>
        <div class="hint-q" style="cursor:pointer;padding:3px 0;border-bottom:1px solid var(--grid)">· 为什么水军评论这么多？</div>
        <div class="hint-q" style="cursor:pointer;padding:3px 0;border-bottom:1px solid var(--grid)">· 饭圈和二游的贬低比例对比如何？</div>
        <div class="hint-q" style="cursor:pointer;padding:3px 0;border-bottom:1px solid var(--grid)">· 有哪些代表性的赞美评论？</div>
        <div class="hint-q" style="cursor:pointer;padding:3px 0">· "砌墙"是什么意思？</div>
      </div>
      <h3>工具箱</h3>
      <div class="muted small">统计查询 · 时间趋势 · 热词排行 · 代表评论 · 双社区对比 · 网络用语RAG检索</div>
    </aside>
    <main class="chat-main">
      <div class="chat-log" id="log"></div>
      <div class="chat-input">
        <input id="q" placeholder="向 AI 分析师提问..." onkeydown="if(event.key==='Enter')send()">
        <button class="btn primary" id="sendB" onclick="send()">发送 →</button>
      </div>
    </main>
  </div>
</div>

<script>
const CC = () => ThemeKit.chartColors();
async function api(url, opts) { const r = await fetch(url, opts); const d = await r.json(); if (!d.success) throw new Error(d.error||"x"); return d.data; }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

async function loadSnap() {
  try {
    const d = await api("/api/videos");
    const c = CC();
    document.getElementById("snap").innerHTML = d.videos.map(v => {
      const cs = v.analysis || {};
      const line = ["赞美","贬低","水军","无意义"].map(n =>
        `<span style="font-weight:900;color:${({ "赞美":c.praise,"贬低":c.blame,"水军":c.shui,"无意义":c.noise })[n]}">${cs[n]||0}</span>`).join(" / ");
      return `<div style="margin-bottom:12px"><b style="letter-spacing:1px">${esc(v.name)} <span class="badge praise" style="${v.community==="饭圈"?"background:var(--cat-blame)":""}">${esc(v.community||"")}</span></b>
        <div class="small muted mt" style="margin-top:4px">${v.analyzed ? line : "未分析"}</div></div>`;
    }).join("");
  } catch (e) {}
}

function addMsg(who, html) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "msg " + who;
  const ts = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  div.innerHTML = `<div class="who">${who==="user"?"YOU":"破妄 AI"} <span style="opacity:.5;margin-left:6px" class="mono">${ts}</span></div><div class="bubble">${html}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

// 建议问题点击 -> 填入输入框并发送
document.querySelectorAll(".hint-q").forEach(q => {
  q.onmouseenter = () => q.style.color = "var(--cyan)";
  q.onmouseleave = () => q.style.color = "";
  q.onclick = () => {
    document.getElementById("q").value = q.textContent.replace(/^·\s*/, "").replace(/？$/, "");
    send();
  };
});

// 欢迎语
addMsg("ai", "你好，我是破妄 AI 分析师。我可以基于已分析的评论数据回答情感统计、双社区对比、趋势、网络用语含义等问题。先到「标注」页完成锚定集并触发分析，数据就绪后我就能给你洞察了。");

async function send() {
  const inp = document.getElementById("q");
  const q = inp.value.trim();
  if (!q) return;
  inp.value = "";
  addMsg("user", esc(q));
  const loading = addMsg("ai", `<span class="typing">分析中</span>`);
  document.getElementById("sendB").disabled = true;
  try {
    const d = await api("/api/agent/chat", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ question:q }) });
    loading.querySelector(".bubble").textContent = d.answer || "(空)";
  } catch (e) {
    loading.querySelector(".bubble").innerHTML = `<span style="color:var(--cat-blame)">请求失败：${esc(e.message)}</span>`;
  }
  document.getElementById("sendB").disabled = false;
}
loadSnap();
</script>
</body>
</html>
